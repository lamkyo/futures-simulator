name: Tier 2 Robustness Checks

on:
  schedule:
    # Runs every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Manual trigger support
  push:
    branches:
      - main

jobs:
  robustness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scipy

      - name: Run Unit Tests (Accounting Identity Verification & DSR Test)
        run: |
          pytest futures_simulator/tests -v

      - name: Run Tier 2 Robustness Pipeline
        run: |
          chmod +x scripts/run_tier2_checks.sh
          bash scripts/run_tier2_checks.sh

      - name: Run Tier 3 AI Reviewer (if summary exists)
        run: |
          if [ -f "scripts/ai_reviewer.py" ]; then
            python scripts/ai_reviewer.py || echo "AI reviewer completed with non-blocking status"
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Tier 2 Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tier2-reports
          path: reports/tier2/

      - name: Send Telegram Status Alert
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python -c "
          import os, requests
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat = os.environ.get('TELEGRAM_CHAT_ID', '')
          status = os.environ.get('STATUS', 'UNKNOWN')
          if token and chat:
              msg = f'🔬 <b>[GitHub Actions] Tier 2 Robustness Checks</b>\nStatus: <b>{status}</b>'
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
                            json={'chat_id': chat, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
          "
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
